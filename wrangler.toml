# Cloudflare Workers + static assets. The dashboard deploy command is
# `npx wrangler deploy`, which runs the build below first.
# Name must match the Workers Builds project (CI overrides a mismatch).
name = "eftyahya1"
main = "workers/site.js"
compatibility_date = "2026-09-12"
workers_dev = true

[build]
command = "npm run build"

# Attach production hosts in the Cloudflare dashboard after the zones
# exist on this account. Declaring custom_domain routes here fails CI when
# Cloudflare cannot infer the zone (error 10082), e.g. eft-cheats.com/.net.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true
