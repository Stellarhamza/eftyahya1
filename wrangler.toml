# Cloudflare Workers + static assets. The dashboard deploy command is
# `npx wrangler deploy`, which runs the build below first.
name = "eft-cheats-net"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[build]
command = "npm run build"

[[routes]]
pattern = "eft-cheats.net"
custom_domain = true

[[routes]]
pattern = "www.eft-cheats.net"
custom_domain = true

# Old host stays on this worker so it can 301 to the canonical domain.
[[routes]]
pattern = "eft-cheats.com"
custom_domain = true

[[routes]]
pattern = "www.eft-cheats.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true
